<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakOn</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;background:#0b0b0f;color:white
}
header{
  padding:18px 25px;background:#111116;border-bottom:1px solid #292932;
  display:flex;justify-content:space-between;align-items:center
}
.logo{font-size:25px;font-weight:bold}
.logo span{color:#4da3ff}
.admin-btn,.sound-btn,.submit-btn,.check-btn{
  border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:bold
}
.admin-btn{background:#202029;color:white}
.sound-btn{background:#202029;color:#4da3ff;margin-bottom:15px}
.container{max-width:700px;margin:40px auto;padding:0 20px}
.card{
  background:#15151c;border:1px solid #292932;border-radius:15px;
  padding:25px;margin-bottom:20px
}
h1{text-align:center}
p{color:#aaa;line-height:1.5}
label{display:block;margin:15px 0 7px;font-weight:bold}
select,textarea,input{
  width:100%;background:#0d0d12;color:white;border:1px solid #333;
  border-radius:8px;padding:12px;font-size:14px
}
textarea{min-height:150px;resize:vertical}
.submit-btn{width:100%;margin-top:18px;background:#4da3ff;color:white}
.check-btn{background:#4da3ff;color:white;margin-top:10px}
.result{
  margin-top:15px;padding:15px;background:#102a1b;
  border-radius:8px;color:#d1fae5
}
.code{
  font-size:24px;font-weight:bold;color:#4da3ff;
  letter-spacing:5px;text-align:center;margin:15px
}
.error{
  display:none;background:#451a1a;color:#fca5a5;
  padding:12px;border-radius:8px;margin-top:12px
}
.small{font-size:13px;color:#777}
</style>
</head>

<body>

<header>
  <div class="logo">SPEAK<span>ON</span></div>
  <button class="admin-btn"
    onclick="location.href='admin.html'">🔐 Admin</button>
</header>

<div class="container">

  <div class="card">
    <h1>🗣️ Ceritakan di SpeakOn</h1>
    <p style="text-align:center">
      Tempat aman untuk menyampaikan cerita secara anonim.
    </p>

    <button id="soundBtn" class="sound-btn">
      🔔 Aktifkan Suara Notifikasi
    </button>

    <label>Topik Cerita</label>
    <select id="topic">
      <option value="Pribadi">Pribadi</option>
      <option value="Sekolah">Sekolah</option>
      <option value="Pertemanan">Pertemanan</option>
      <option value="Keluarga">Keluarga</option>
      <option value="Lainnya">Lainnya</option>
    </select>

    <label>Ditujukan kepada</label>
    <select id="admin">
      <option value="Admin 1">Admin 1</option>
      <option value="Admin 2">Admin 2</option>
      <option value="Admin 3">Admin 3</option>
    </select>

    <label>Ceritamu</label>
    <textarea id="message"
      placeholder="Tulis ceritamu di sini..."></textarea>

    <button id="submitBtn" class="submit-btn">
      Kirim Cerita
    </button>

    <div id="error" class="error"></div>
  </div>

  <div id="codeCard" class="card" style="display:none">
    <h2 style="text-align:center">🔑 Kode Ceritamu</h2>
    <p style="text-align:center">
      Simpan kode ini untuk melihat balasan Admin.
    </p>

    <div id="storyCode" class="code"></div>

    <div id="replyResult" class="result">
      ⏳ Menunggu balasan Admin...
    </div>
  </div>

  <div class="card">
    <h2>💬 Cek Balasan</h2>

    <p>
      Masukkan kode cerita yang kamu simpan.
    </p>

    <input id="checkCode"
      maxlength="4"
      placeholder="Contoh: A7K2">

    <button id="checkBtn" class="check-btn">
      Cek Balasan
    </button>

    <div id="checkResult" class="result" style="display:none"></div>
  </div>

</div>

<script type="module">

import {db} from "./firebase.js";

import {
  doc,setDoc,getDoc,onSnapshot,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


// ===============================
// SUARA NOTIFIKASI
// ===============================

let audioContext=null;
let soundEnabled=false;

function playSound(){

  if(!soundEnabled)return;

  if(!audioContext)
    audioContext=new AudioContext();

  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.frequency.value=800;
  gain.gain.setValueAtTime(.2,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .01,audioContext.currentTime+.5
  );

  osc.start();
  osc.stop(audioContext.currentTime+.5);
}

soundBtn.onclick=async()=>{

  audioContext=new AudioContext();

  if(audioContext.state==="suspended")
    await audioContext.resume();

  soundEnabled=true;
  soundBtn.textContent="🔔 Suara Notifikasi Aktif";

  playSound();
};


// ===============================
// BUAT KODE 4 KARAKTER
// ===============================

function makeCode(){

  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="";

  for(let i=0;i<4;i++)
    code+=chars[Math.floor(Math.random()*chars.length)];

  return code;
}


// ===============================
// KIRIM CERITA
// ===============================

submitBtn.onclick=async()=>{

  error.style.display="none";

  const message=document.getElementById("message").value.trim();
  const topic=document.getElementById("topic").value;
  const admin=document.getElementById("admin").value;

  if(!message){

    error.textContent="Tulis ceritamu terlebih dahulu.";
    error.style.display="block";
    return;
  }

  submitBtn.disabled=true;
  submitBtn.textContent="Mengirim...";

  try{

    let code;
    let ref;
    let snap;

    // Cari kode yang belum digunakan
    do{
      code=makeCode();
      ref=doc(db,"stories",code);
      snap=await getDoc(ref);
    }while(snap.exists());

    await setDoc(ref,{
      topic:topic,
      admin:admin,
      message:message,
      storyCode:code,
      reply:"",
      status:"Menunggu",
      createdAt:serverTimestamp()
    });

    storyCode.textContent=code;
    codeCard.style.display="block";

    document.getElementById("message").value="";

    // Pantau balasan secara langsung
    watchReply(code);

  }catch(err){

    console.error(err);

    error.textContent=
      "Cerita gagal dikirim. Periksa koneksi dan Firestore Rules.";

    error.style.display="block";

  }

  submitBtn.disabled=false;
  submitBtn.textContent="Kirim Cerita";
};


// ===============================
// PANTAU BALASAN
// ===============================

let stopReply=null;

function watchReply(code){

  if(stopReply)stopReply();

  const ref=doc(db,"stories",code);
  let first=true;
  let oldReply="";

  stopReply=onSnapshot(ref,(snap)=>{

    if(!snap.exists())return;

    const data=snap.data();
    const reply=data.reply||"";

    if(reply){

      replyResult.innerHTML=
        "<b>💬 Balasan Admin:</b><br><br>"+
        escapeHTML(reply);

      if(!first && reply!==oldReply)
        playSound();

      oldReply=reply;
    }

    first=false;
  });
}


// ===============================
// CEK KODE
// ===============================

checkBtn.onclick=async()=>{

  const code=
    document.getElementById("checkCode")
    .value.trim().toUpperCase();

  if(code.length!==4){

    showCheck("Masukkan kode 4 karakter.");
    return;
  }

  checkBtn.disabled=true;
  checkBtn.textContent="Memeriksa...";

  try{

    const snap=
      await getDoc(doc(db,"stories",code));

    if(!snap.exists()){

      showCheck("❌ Kode cerita tidak ditemukan.");

    }else{

      const data=snap.data();

      if(data.reply){

        showCheck(
          "<b>💬 Balasan Admin:</b><br><br>"+
          escapeHTML(data.reply)
        );

      }else{

        showCheck(
          "⏳ Ceritamu belum dibalas Admin."
        );

      }

      watchReply(code);
    }

  }catch(err){

    console.error(err);

    showCheck(
      "❌ Gagal mengecek. Periksa koneksi."
    );

  }

  checkBtn.disabled=false;
  checkBtn.textContent="Cek Balasan";
};


// ===============================
// TAMPILKAN HASIL
// ===============================

function showCheck(text){

  checkResult.innerHTML=text;
  checkResult.style.display="block";
}


// ===============================
// AMANKAN TEKS
// ===============================

function escapeHTML(text){

  const div=document.createElement("div");
  div.textContent=String(text);
  return div.innerHTML;
}

</script>

</body>
</html>
