<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeakOn</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b0b0f;
color:#fff;
font-family:Arial,sans-serif
}

header{
padding:18px 22px;
background:#111116;
border-bottom:1px solid #292932;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:25px;
font-weight:bold
}

.logo span{
color:#4da3ff
}

.admin{
background:#4da3ff;
color:white;
padding:10px 14px;
border-radius:8px;
text-decoration:none;
font-weight:bold
}

.container{
max-width:700px;
margin:30px auto;
padding:15px
}

.card{
background:#15151c;
border:1px solid #292932;
border-radius:15px;
padding:20px;
margin-bottom:18px
}

h1{
margin-top:0
}

label{
display:block;
margin:14px 0 7px;
color:#ccc
}

select,textarea{
width:100%;
background:#0d0d12;
color:white;
border:1px solid #333;
border-radius:9px;
padding:13px;
font-size:15px
}

textarea{
min-height:150px;
resize:vertical
}

button{
border:0;
border-radius:9px;
padding:12px 16px;
font-weight:bold;
cursor:pointer
}

.sound{
width:100%;
background:#202029;
color:#4da3ff;
margin-bottom:15px
}

.sound.active{
background:#12351f;
color:#4ade80
}

.send{
width:100%;
background:#4da3ff;
color:white;
margin-top:15px
}

.status{
padding:14px;
border-radius:9px;
background:#202029;
margin-top:15px;
display:none;
line-height:1.5
}

.reply{
background:#102a1b;
border:1px solid #1f6138;
padding:16px;
border-radius:10px;
margin-top:15px;
display:none
}

.small{
color:#999;
font-size:13px;
line-height:1.5
}

.success{
color:#4ade80
}

@media(max-width:600px){
.container{
margin:15px auto;
padding:10px
}

header{
padding:15px
}

.logo{
font-size:21px
}
}
</style>
</head>

<body>

<header>

<div class="logo">
SPEAK<span>ON</span>
</div>

<a class="admin" href="admin.html">
Login Admin
</a>

</header>


<div class="container">

<div class="card">

<h1>💬 Ceritakan Sesuatu</h1>

<p class="small">
Ceritamu bersifat anonim. Pilih admin yang ingin menerima ceritamu.
</p>


<button id="soundBtn" class="sound">
🔔 Aktifkan Suara Notifikasi
</button>


<label>Topik</label>

<select id="topic">

<option>Masalah pribadi</option>
<option>Belajar dan tugas</option>
<option>Pertemanan</option>
<option>Lingkungan sekolah</option>
<option>Aspirasi dan saran</option>
<option>Lainnya</option>

</select>


<label>Ditujukan kepada</label>

<select id="admin">

<option>Admin 1</option>
<option>Admin 2</option>
<option>Admin 3</option>

</select>


<label>Ceritamu</label>

<textarea
id="message"
placeholder="Tulis ceritamu di sini..."
></textarea>


<button id="send" class="send">
Kirim Cerita
</button>


<div id="status" class="status"></div>


<div id="reply" class="reply"></div>

</div>


<div class="card">

<h3>🔒 Privasi</h3>

<p class="small">
Identitas pencerita tidak ditampilkan kepada admin.
SpeakOn hanya menggunakan ID anonim untuk menghubungkan
cerita dengan balasannya.
</p>

</div>

</div>


<script type="module">

import{db}from"./firebase.js";

import{
collection,
addDoc,
serverTimestamp,
doc,
onSnapshot
}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const $=id=>document.getElementById(id);


// ===============================
// ID ANONIM
// ===============================

let userId=localStorage.getItem("speakOnUserId");

if(!userId){

userId=
"anon_"+crypto.randomUUID();

localStorage.setItem(
"speakOnUserId",
userId
);

}


// ===============================
// SUARA
// ===============================

let audio=null;
let soundEnabled=false;

$("soundBtn").onclick=async()=>{

try{

const AC=
window.AudioContext||
window.webkitAudioContext;

audio ||= new AC();

if(audio.state==="suspended")
await audio.resume();

soundEnabled=true;

$("soundBtn").classList.add("active");

$("soundBtn").textContent=
"🔔 Suara Notifikasi Aktif";

playSound();

if("Notification" in window){

if(Notification.permission==="default"){

await Notification.requestPermission();

}

}

}catch(e){

console.error(e);

alert(
"Suara tidak dapat diaktifkan di browser ini."
);

}

};


function playSound(){

if(!soundEnabled||!audio)return;

const osc=audio.createOscillator();
const gain=audio.createGain();

osc.connect(gain);
gain.connect(audio.destination);

osc.type="sine";
osc.frequency.setValueAtTime(
880,
audio.currentTime
);

osc.frequency.setValueAtTime(
660,
audio.currentTime+.12
);

gain.gain.setValueAtTime(
.25,
audio.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.01,
audio.currentTime+.5
);

osc.start();
osc.stop(
audio.currentTime+.5
);

}


// ===============================
// NOTIFIKASI BROWSER
// ===============================

function browserNotification(){

if(
"Notification" in window &&
Notification.permission==="granted"
){

new Notification(
"💬 SpeakOn",
{
body:"Admin telah membalas ceritamu.",
icon:"https://mqamqaoke-sketch.github.io/Speak-On/"
}
);

}

}


// ===============================
// SIMPAN STORY ID
// ===============================

function saveStoryId(id){

let ids=
JSON.parse(
localStorage.getItem("speakOnStoryIds")||"[]"
);

if(!ids.includes(id))
ids.push(id);

ids=ids.slice(-20);

localStorage.setItem(
"speakOnStoryIds",
JSON.stringify(ids)
);

}


// ===============================
// MONITOR BALASAN
// ===============================

const watched={};

function watchStory(id){

if(watched[id])return;

watched[id]=true;

let first=true;
let oldReply="";

onSnapshot(
doc(db,"stories",id),
snap=>{

if(!snap.exists())return;

const data=snap.data();
const reply=String(data.reply||"").trim();


// pertama kali hanya menyimpan data
if(first){

oldReply=reply;
first=false;

showReply(reply);

return;

}


// ADMIN MEMBALAS
if(
reply &&
reply!==oldReply
){

oldReply=reply;

showReply(reply);

playSound();

browserNotification();

}

},
error=>console.error(error)
);

}


// ===============================
// TAMPILKAN BALASAN
// ===============================

function showReply(reply){

const box=$("reply");

if(!reply){

box.style.display="none";
return;

}

box.style.display="block";

box.innerHTML=`
<b>💬 Balasan Admin</b>
<br><br>
${safe(reply)}
`;

}


// ===============================
// LOAD CERITA YANG PERNAH DIKIRIM
// ===============================

const savedIds=
JSON.parse(
localStorage.getItem("speakOnStoryIds")||"[]"
);

savedIds.forEach(id=>watchStory(id));


// ===============================
// KIRIM CERITA
// ===============================

$("send").onclick=async()=>{

const message=
$("message").value.trim();

const topic=
$("topic").value;

const admin=
$("admin").value;

if(!message){

alert("Silakan tulis ceritamu terlebih dahulu.");

return;

}


const btn=$("send");

btn.disabled=true;
btn.textContent="Mengirim...";


try{

const ref=await addDoc(
collection(db,"stories"),
{
topic,
admin,
message,
userId,
reply:"",
status:"Menunggu",
createdAt:serverTimestamp()
}
);


saveStoryId(ref.id);

watchStory(ref.id);

$("message").value="";

$("status").style.display="block";

$("status").innerHTML=
`<span class="success">
✅ Cerita berhasil dikirim secara anonim.
</span><br>
Tunggu balasan dari ${safe(admin)}.
`;

}catch(e){

console.error(e);

$("status").style.display="block";

$("status").innerHTML=
"❌ Cerita gagal dikirim. Coba lagi.";

}

btn.disabled=false;
btn.textContent="Kirim Cerita";

};


// ===============================
// ANTI HTML
// ===============================

function safe(text){

const div=
document.createElement("div");

div.textContent=
String(text);

return div.innerHTML;

}

</script>

</body>
</html>
