<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SpeakOn - Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #060b0f;
      color: #f1f5f4;
      min-height: 100vh;
    }

    header {
      background: #0d171d;
      border-bottom: 1px solid #20343b;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #71d8d0;
    }

    .admin-info {
      text-align: right;
      font-size: 13px;
      color: #9fb0b5;
    }

    .admin-name {
      color: #71d8d0;
      font-weight: bold;
      margin-bottom: 3px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
      border-radius: 10px;
    }

    .login-btn {
      background: #36a6a4;
      color: white;
      padding: 11px 17px;
    }

    .logout-btn {
      background: #18262d;
      color: #f1f5f4;
      padding: 9px 14px;
      margin-top: 8px;
      border: 1px solid #30434a;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #9fb0b5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: #0d171d;
      border: 1px solid #20343b;
      border-radius: 15px;
      padding: 20px;
    }

    .stat-title {
      color: #9fb0b5;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #71d8d0;
    }

    .login-box {
      background: #0d171d;
      border: 1px solid #20343b;
      border-radius: 18px;
      padding: 30px;
      text-align: center;
      margin-top: 20px;
    }

    .login-box h2 {
      margin-bottom: 10px;
    }

    .login-box p {
      color: #9fb0b5;
      margin-bottom: 20px;
    }

    .google-btn {
      background: white;
      color: #222;
      padding: 13px 22px;
      font-size: 15px;
    }

    .stories-title {
      margin-bottom: 15px;
      font-size: 22px;
    }

    .story-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .story {
      background: #0d171d;
      border: 1px solid #20343b;
      border-radius: 17px;
      padding: 20px;
    }

    .story-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .topic {
      color: #71d8d0;
      font-weight: bold;
    }

    .date {
      color: #73868c;
      font-size: 12px;
    }

    .story-code {
      display: inline-block;
      background: #13252b;
      border: 1px solid #275158;
      color: #71d8d0;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 12px;
      margin-top: 8px;
    }

    .story-message {
      background: #081116;
      border-radius: 12px;
      padding: 15px;
      line-height: 1.6;
      margin-bottom: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .conversation {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-user {
      align-self: flex-start;
      background: #17252b;
      border: 1px solid #263d44;
    }

    .message-admin {
      align-self: flex-end;
      background: #17615f;
      color: white;
    }

    .message-label {
      font-size: 11px;
      opacity: .7;
      margin-bottom: 4px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      background: #081116;
      color: white;
      border: 1px solid #294047;
      border-radius: 12px;
      padding: 13px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
    }

    textarea:focus {
      border-color: #36a6a4;
    }

    .reply-btn {
      background: #36a6a4;
      color: white;
      padding: 12px 18px;
      margin-top: 10px;
    }

    .reply-btn:hover {
      background: #2b8e8c;
    }

    .status {
      margin-top: 10px;
      color: #71d8d0;
      font-size: 13px;
    }

    .empty {
      background: #0d171d;
      border: 1px dashed #30434a;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      color: #829399;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {
      header {
        padding: 15px;
      }

      .admin-info {
        font-size: 11px;
      }

      main {
        padding: 22px 12px 50px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .message {
        max-width: 95%;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    SpeakOn
  </div>

  <div id="adminArea" class="hidden">

    <div class="admin-info">
      <div id="adminName" class="admin-name"></div>
      <div id="adminEmail"></div>
    </div>

    <button id="logoutBtn" class="logout-btn">
      Keluar
    </button>

  </div>

</header>


<main>

  <!-- LOGIN -->

  <section id="loginSection" class="login-box">

    <h2>Login Admin</h2>

    <p>
      Masuk menggunakan akun Google yang telah terdaftar sebagai admin.
    </p>

    <button id="googleLogin" class="google-btn">
      🔐 Login dengan Google
    </button>

    <div id="loginStatus" class="status"></div>

  </section>


  <!-- DASHBOARD -->

  <section id="dashboard" class="hidden">

    <div class="welcome">

      <h1>Dashboard Admin</h1>

      <p>
        Kelola cerita dan balas pesan dari pencerita SpeakOn.
      </p>

    </div>


    <!-- STATISTIK -->

    <div class="stats">

      <div class="stat">
        <div class="stat-title">
          Total Cerita
        </div>

        <div id="totalStories" class="stat-value">
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Belum Dijawab
        </div>

        <div id="unansweredStories" class="stat-value">
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Sudah Dijawab
        </div>

        <div id="answeredStories" class="stat-value">
          0
        </div>
      </div>

    </div>


    <h2 class="stories-title">
      Cerita Masuk
    </h2>


    <div id="storyList" class="story-list">

      <div class="empty">
        Memuat cerita...
      </div>

    </div>

  </section>

</main>


<script type="module">

  import {
    collection,
    query,
    orderBy,
    onSnapshot,
    updateDoc,
    doc,
    arrayUnion
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  import {
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  import {
    auth,
    db
  } from "./firebase.js";


  /* =========================
     ADMIN YANG DIIZINKAN
  ========================= */

  const ADMIN_EMAILS = {

    "ypiiw86@gmail.com": "Admin 1",

    "restuaxioo@gmail.com": "Admin 2",

    "dinolahh284@gmail.com": "Admin 3"

  };


  /* =========================
     ELEMENT
  ========================= */

  const loginSection =
    document.getElementById("loginSection");

  const dashboard =
    document.getElementById("dashboard");

  const adminArea =
    document.getElementById("adminArea");

  const googleLogin =
    document.getElementById("googleLogin");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const loginStatus =
    document.getElementById("loginStatus");

  const adminName =
    document.getElementById("adminName");

  const adminEmail =
    document.getElementById("adminEmail");

  const storyList =
    document.getElementById("storyList");

  const totalStories =
    document.getElementById("totalStories");

  const unansweredStories =
    document.getElementById("unansweredStories");

  const answeredStories =
    document.getElementById("answeredStories");


  let currentAdminRole = "";

  let allStories = [];


  /* =========================
     LOGIN GOOGLE
  ========================= */

  googleLogin.addEventListener("click", async () => {

    try {

      loginStatus.textContent =
        "Membuka login Google...";

      const provider =
        new GoogleAuthProvider();

      await signInWithPopup(
        auth,
        provider
      );

    } catch (error) {

      console.error(error);

      loginStatus.textContent =
        "Login gagal. Silakan coba lagi.";

    }

  });


  /* =========================
     AUTH CHECK
  ========================= */

  onAuthStateChanged(auth, (user) => {

    if (!user) {

      loginSection.classList.remove("hidden");

      dashboard.classList.add("hidden");

      adminArea.classList.add("hidden");

      currentAdminRole = "";

      return;

    }


    const email =
      user.email?.toLowerCase();


    if (!ADMIN_EMAILS[email]) {

      alert(
        "Akun ini tidak terdaftar sebagai admin."
      );

      signOut(auth);

      return;

    }


    currentAdminRole =
      ADMIN_EMAILS[email];


    adminName.textContent =
      currentAdminRole;


    adminEmail.textContent =
      email;


    loginSection.classList.add("hidden");

    dashboard.classList.remove("hidden");

    adminArea.classList.remove("hidden");


    loadStories();

  });


  /* =========================
     LOGOUT
  ========================= */

  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

  });


  /* =========================
     LOAD STORIES
  ========================= */

  function loadStories() {

    const storiesQuery = query(

      collection(db, "stories"),

      orderBy(
        "createdAt",
        "desc"
      )

    );


    onSnapshot(
      storiesQuery,

      (snapshot) => {

        allStories = [];


        snapshot.forEach((item) => {

          const data = item.data();


          /*
             Hanya tampilkan cerita
             yang ditujukan ke admin ini.
          */

          if (
            data.admin &&
            data.admin !== currentAdminRole
          ) {

            return;

          }


          allStories.push({

            id: item.id,

            ...data

          });

        });


        updateStats();

        renderStories();

      },


      (error) => {

        console.error(
          "Firestore error:",
          error
        );

        storyList.innerHTML = `

          <div class="empty">

            Gagal mengambil data cerita.

            <br><br>

            ${error.message}

          </div>

        `;

      }

    );

  }


  /* =========================
     STATISTIK
  ========================= */

  function updateStats() {

    totalStories.textContent =
      allStories.length;


    const answered =
      allStories.filter(
        story =>
          story.status === "Sudah dijawab"
          ||
          (
            Array.isArray(story.conversation)
            &&
            story.conversation.some(
              message =>
                message.sender === "admin"
            )
          )
      ).length;


    answeredStories.textContent =
      answered;


    unansweredStories.textContent =
      allStories.length - answered;

  }


  /* =========================
     RENDER STORIES
  ========================= */

  function renderStories() {

    if (!allStories.length) {

      storyList.innerHTML = `

        <div class="empty">

          Belum ada cerita masuk.

        </div>

      `;

      return;

    }


    storyList.innerHTML = "";


    allStories.forEach((story) => {

      const card =
        document.createElement("div");

      card.className = "story";


      const date =
        formatDate(story.createdAt);


      const topic =
        escapeHTML(
          story.topic || "Tanpa topik"
        );


      const storyText =
        escapeHTML(
          story.message ||
          story.story ||
          "Tidak ada isi cerita."
        );


      const code =
        escapeHTML(
          story.storyCode ||
          "-"
        );


      card.innerHTML = `

        <div class="story-top">

          <div>

            <div class="topic">
              ${topic}
            </div>

            <div class="story-code">
              Kode: ${code}
            </div>

          </div>

          <div class="date">
            ${date}
          </div>

        </div>


        <div class="story-message">

          ${storyText}

        </div>


        <div
          class="conversation"
          id="conversation-${story.id}"
        ></div>


        <textarea
          id="reply-${story.id}"
          placeholder="Tulis balasan untuk pencerita..."
        ></textarea>


        <button
          class="reply-btn"
          data-id="${story.id}"
        >

          💬 Kirim Balasan

        </button>


        <div
          class="status"
          id="status-${story.id}"
        ></div>

      `;


      storyList.appendChild(card);


      renderConversation(
        story.id,
        story
      );

    });


    document
      .querySelectorAll(".reply-btn")
      .forEach((button) => {

        button.addEventListener(
          "click",
          () => {

            sendReply(
              button.dataset.id
            );

          }
        );

      });

  }


  /* =========================
     RENDER PERCAKAPAN
  ========================= */

  function renderConversation(
    storyId,
    story
  ) {

    const box =
      document.getElementById(
        `conversation-${storyId}`
      );


    if (!box) return;


    let messages = [];


    /*
       Percakapan baru
    */

    if (
      Array.isArray(
        story.conversation
      )
    ) {

      messages =
        [...story.conversation];

    }


    /*
       Jika data lama belum
       mempunyai conversation,
       tetap tampilkan reply lama.
    */

    if (
      !messages.length
      &&
      story.reply
    ) {

      messages.push({

        sender: "admin",

        text: story.reply,

        createdAt:
          story.repliedAt ||
          new Date().toISOString()

      });

    }


    box.innerHTML = "";


    messages.forEach((message) => {

      const div =
        document.createElement("div");


      const isAdmin =
        message.sender === "admin";


      div.className =
        "message " +
        (
          isAdmin
            ? "message-admin"
            : "message-user"
        );


      const label =
        isAdmin
          ? "Admin"
          : "Pencerita";


      div.innerHTML = `

        <div class="message-label">

          ${label}

        </div>

        <div>

          ${escapeHTML(
            message.text || ""
          )}

        </div>

      `;


      box.appendChild(div);

    });

  }


  /* =========================
     KIRIM BALASAN
  ========================= */

  async function sendReply(
    storyId
  ) {

    const textarea =
      document.getElementById(
        `reply-${storyId}`
      );


    const status =
      document.getElementById(
        `status-${storyId}`
      );


    const replyText =
      textarea.value.trim();


    if (!replyText) {

      status.textContent =
        "Tulis balasan terlebih dahulu.";

      return;

    }


    try {

      status.textContent =
        "Mengirim balasan...";

        const newMessage = {

        sender: "admin",

        admin: currentAdminRole,

        text: replyText,

        createdAt:
          new Date().toISOString()

      };


      await updateDoc(

        doc(
          db,
          "stories",
          storyId
        ),

        {

          conversation:
            arrayUnion(newMessage),

          reply:
            replyText,

          repliedAt:
            new Date().toISOString(),

          status:
            "Sudah dijawab"

        }

      );


      textarea.value = "";


      status.textContent =
        "✓ Balasan berhasil dikirim.";


    } catch (error) {

      console.error(
        "Gagal mengirim balasan:",
        error
      );


      status.textContent =
        "Gagal mengirim balasan: " +
        error.message;

    }

  }


  /* =========================
     FORMAT TANGGAL
  ========================= */

  function formatDate(value) {

    if (!value) {

      return "Waktu tidak diketahui";

    }


    let date;


    try {

      if (
        typeof value.toDate ===
        "function"
      ) {

        date = value.toDate();

      } else {

        date = new Date(value);

      }

    } catch (error) {

      return "Waktu tidak diketahui";

    }


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "Waktu tidak diketahui";

    }


    return date.toLocaleString(
      "id-ID",
      {

        day: "2-digit",

        month: "2-digit",

        year: "numeric",

        hour: "2-digit",

        minute: "2-digit"

      }

    );

  }


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHTML(text) {

    const div =
      document.createElement("div");


    div.textContent =
      String(text);


    return div.innerHTML;

  }

</script>

</body>
</html>
