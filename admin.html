<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeakOn - Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;color:white;font-family:Arial,sans-serif}
header{padding:18px 25px;background:#111116;border-bottom:1px solid #292932;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold}.logo span{color:#4da3ff}
button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:bold}
.logout{background:#ef4444;color:white;display:none}
.login,.dashboard{max-width:1000px;margin:35px auto;padding:20px}
.login{max-width:500px;background:#15151c;border:1px solid #292932;border-radius:15px;text-align:center}
.google{background:white;color:#111;margin-top:15px}
.error{display:none;background:#451a1a;color:#fca5a5;padding:12px;border-radius:8px;margin-top:15px}
.info,.message,.stat{background:#15151c;border:1px solid #292932;border-radius:12px;padding:16px;margin-bottom:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-title{color:#999;font-size:13px}.stat-number{font-size:27px;font-weight:bold;color:#4da3ff;margin-top:7px}
.sound{width:100%;background:#202029;color:#4da3ff;margin-bottom:18px}
.sound.active{background:#12351f;color:#4ade80}
.message-header{display:flex;justify-content:space-between;margin-bottom:10px}
.anonymous{color:#4da3ff;font-weight:bold}.time{color:#777;font-size:12px}
.topic{display:inline-block;background:#202029;padding:6px 10px;border-radius:6px;font-size:13px}
.text{color:#ddd;line-height:1.6;white-space:pre-wrap;margin:14px 0}
.target{color:#aaa;margin-bottom:14px}
textarea{width:100%;min-height:80px;background:#0d0d12;color:white;border:1px solid #333;border-radius:8px;padding:12px;resize:vertical}
.send{background:#4da3ff;color:white;margin-top:8px}
.existing{background:#102a1b;color:#d1fae5;padding:14px;border-radius:8px;line-height:1.5}
.empty,.loading{text-align:center;color:#888;padding:35px}
.empty{background:#15151c;border:1px solid #292932;border-radius:12px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.login,.dashboard{margin:15px auto;padding:12px}.message-header{flex-direction:column;gap:6px}}
@media(max-width:400px){.stats{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<div class="logo">SPEAK<span>ON</span> ADMIN</div>
<button id="logout" class="logout">Keluar</button>
</header>


<div id="loginBox" class="login">

<h1>🔐 Login Admin</h1>
<p>Masuk menggunakan akun Google admin SpeakOn.</p>

<button id="google" class="google">
🔵 Masuk dengan Google
</button>

<div id="error" class="error"></div>

</div>


<div id="dashboard" class="dashboard" style="display:none">

<h1>Dashboard SpeakOn</h1>

<div class="info">
👤 <b id="email"></b><br>
🛡️ <span id="role"></span>
</div>


<div class="stats">

<div class="stat">
<div class="stat-title">👤 Pengguna</div>
<div id="users" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-title">💬 Total Cerita</div>
<div id="stories" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-title">✅ Sudah Dibalas</div>
<div id="replied" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-title">⏳ Belum Dibalas</div>
<div id="waiting" class="stat-number">0</div>
</div>

</div>


<button id="sound" class="sound">
🔔 Aktifkan Suara Notifikasi
</button>


<div id="messages">
<div class="loading">Memuat cerita...</div>
</div>

</div>


<script type="module">

import{auth,db}from"./firebase.js";

import{
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import{
collection,
query,
orderBy,
onSnapshot,
doc,
updateDoc
}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const ADMINS={
"ypiiw86@gmail.com":"Admin 1",
"restuaxioo@gmail.com":"Admin 2",
"dinolahh284@gmail.com":"Admin 3"
};

const $=id=>document.getElementById(id);

let currentAdmin="";
let unsubscribe=null;
let firstLoad=true;
let audio=null;
let soundOn=false;


// ================= SUARA =================

$("sound").onclick=async()=>{

try{

const AC=window.AudioContext||window.webkitAudioContext;

if(!AC)return alert("Browser tidak mendukung suara.");

audio ||= new AC();

if(audio.state==="suspended")await audio.resume();

soundOn=true;

$("sound").classList.add("active");
$("sound").textContent="🔔 Suara Notifikasi Aktif";

playSound();

}catch(e){console.error(e)}

};


function playSound(){

if(!soundOn||!audio)return;

const o=audio.createOscillator();
const g=audio.createGain();

o.connect(g);
g.connect(audio.destination);

o.frequency.value=850;
g.gain.setValueAtTime(.2,audio.currentTime);
g.gain.exponentialRampToValueAtTime(
.01,audio.currentTime+.5
);

o.start();
o.stop(audio.currentTime+.5);

}


// ================= LOGIN =================

$("google").onclick=async()=>{

$("error").style.display="none";
$("google").disabled=true;

try{

await signInWithPopup(
auth,
new GoogleAuthProvider()
);

}catch(e){

console.error(e);
$("error").textContent="Login gagal. Coba lagi.";
$("error").style.display="block";

}

$("google").disabled=false;

};


onAuthStateChanged(auth,user=>{

if(!user){

$("loginBox").style.display="block";
$("dashboard").style.display="none";
$("logout").style.display="none";

if(unsubscribe){
unsubscribe();
unsubscribe=null;
}

return;

}


const mail=(user.email||"").toLowerCase();

if(!ADMINS[mail]){

alert("Akun ini bukan admin SpeakOn.");
signOut(auth);
return;

}


currentAdmin=ADMINS[mail];

$("loginBox").style.display="none";
$("dashboard").style.display="block";
$("logout").style.display="block";

$("email").textContent=user.email;
$("role").textContent=currentAdmin;

loadStories();

});


$("logout").onclick=()=>signOut(auth);


// ================= CERITA =================

function loadStories(){

if(unsubscribe)unsubscribe();

const q=query(
collection(db,"stories"),
orderBy("createdAt","desc")
);

firstLoad=true;

unsubscribe=onSnapshot(q,snap=>{

const users=new Set();
let total=0,replied=0,waiting=0;

const list=[];


snap.forEach(s=>{

const d=s.data();

if(d.admin!==currentAdmin)return;

total++;

if(d.userId)users.add(d.userId);

if(String(d.reply||"").trim())replied++;
else waiting++;

list.push({id:s.id,d});

});


$("users").textContent=users.size;
$("stories").textContent=total;
$("replied").textContent=replied;
$("waiting").textContent=waiting;


// NOTIF CERITA BARU

if(!firstLoad){

snap.docChanges().forEach(c=>{

const d=c.doc.data();

if(
c.type==="added" &&
d.admin===currentAdmin
){

playSound();

}

});

}

firstLoad=false;


// TAMPILKAN CERITA

if(!list.length){

$("messages").innerHTML=
`<div class="empty">📭 Belum ada cerita masuk.</div>`;

return;

}


$("messages").innerHTML="";


list.forEach(({id,d})=>{

let date="Waktu belum tersedia";

if(d.createdAt){

try{
date=d.createdAt.toDate().toLocaleString("id-ID");
}catch(e){}

}


const card=document.createElement("div");

card.className="message";

card.innerHTML=`

<div class="message-header">

<span class="anonymous">
👤 Pencerita Anonim
</span>

<span class="time">
${safe(date)}
</span>

</div>

<div class="topic">
${safe(d.topic||"Tanpa topik")}
</div>

<div class="target">
🎯 Ditujukan kepada:
<b>${safe(d.admin||"")}</b>
</div>

<div class="text">
${safe(d.message||"")}
</div>

${
d.reply

?

`<div class="existing">
<b>💬 Balasan Admin:</b><br><br>
${safe(d.reply)}
</div>`

:

`<textarea
id="reply-${id}"
placeholder="Tulis balasan..."
></textarea>

<button
class="send"
data-id="${id}"
>
Kirim Balasan
</button>`

}

`;

$("messages").appendChild(card);

});


document.querySelectorAll(".send").forEach(btn=>{

btn.onclick=()=>sendReply(btn);

});


},err=>{

console.error(err);

$("messages").innerHTML=
`<div class="error" style="display:block">
❌ Gagal memuat cerita. Periksa Firestore Rules.
</div>`;

});

}


// ================= BALAS =================

async function sendReply(btn){

const id=btn.dataset.id;
const box=$("reply-"+id);

const reply=box?.value.trim();

if(!reply){

alert("Tulis balasan terlebih dahulu.");
return;

}

btn.disabled=true;
btn.textContent="Mengirim...";

try{

await updateDoc(
doc(db,"stories",id),
{
reply:reply,
status:"Sudah dijawab"
}
);

alert("Balasan berhasil dikirim.");

}catch(e){

console.error(e);

alert("Balasan gagal dikirim.");

btn.disabled=false;
btn.textContent="Kirim Balasan";

}

}


// ================= KEAMANAN TEKS =================

function safe(text){

const div=document.createElement("div");
div.textContent=String(text);
return div.innerHTML;

}

</script>

</body>
</html>
