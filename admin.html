<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeakOn - Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0b0f;
  color:white;
  font-family:Arial,sans-serif
}

header{
  padding:18px 25px;
  background:#111116;
  border-bottom:1px solid #292932;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.logo{
  font-size:24px;
  font-weight:bold
}

.logo span{color:#4da3ff}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold
}

.logout{
  background:#ef4444;
  color:white;
  display:none
}

.login,.dashboard{
  max-width:1000px;
  margin:40px auto;
  padding:20px
}

.login{
  max-width:500px;
  background:#15151c;
  border:1px solid #292932;
  border-radius:15px;
  text-align:center
}

.google{
  background:white;
  color:#111;
  margin-top:15px
}

.error{
  display:none;
  background:#451a1a;
  color:#fca5a5;
  padding:12px;
  border-radius:8px;
  margin-top:15px
}

.info,.message{
  background:#15151c;
  border:1px solid #292932;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px
}

.stat{
  background:#15151c;
  border:1px solid #292932;
  border-radius:12px;
  padding:16px
}

.stat-title{
  color:#999;
  font-size:13px;
  margin-bottom:8px
}

.stat-number{
  font-size:28px;
  font-weight:bold;
  color:#4da3ff
}

.message-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px
}

.anonymous{
  color:#4da3ff;
  font-weight:bold
}

.time{
  color:#777;
  font-size:12px
}

.topic{
  display:inline-block;
  background:#202029;
  padding:6px 10px;
  border-radius:6px;
  font-size:13px
}

.text{
  color:#ddd;
  line-height:1.6;
  white-space:pre-wrap;
  margin:15px 0
}

.target{
  color:#aaa;
  margin-bottom:15px
}

.reply{
  border-top:1px solid #292932;
  padding-top:15px
}

textarea{
  width:100%;
  min-height:90px;
  background:#0d0d12;
  color:white;
  border:1px solid #333;
  border-radius:8px;
  padding:12px;
  resize:vertical
}

textarea:focus{
  outline:none;
  border-color:#4da3ff
}

.send{
  background:#4da3ff;
  color:white;
  margin-top:10px
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed
}

.existing{
  background:#102a1b;
  color:#d1fae5;
  padding:15px;
  border-radius:8px;
  line-height:1.6
}

.sound{
  background:#202029;
  color:#4da3ff;
  margin-bottom:18px
}

.sound.active{
  background:#12351f;
  color:#4ade80
}

.empty{
  text-align:center;
  color:#888;
  padding:40px;
  background:#15151c;
  border:1px solid #292932;
  border-radius:12px
}

.loading{
  text-align:center;
  color:#aaa;
  padding:30px
}

@media(max-width:700px){
  .stats{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  header{padding:15px}

  .login,.dashboard{
    margin:20px auto;
    padding:12px
  }

  .message-header{
    flex-direction:column;
    gap:7px
  }
}

@media(max-width:400px){
  .stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>

  <div class="logo">
    SPEAK<span>ON</span> ADMIN
  </div>

  <button id="logout" class="logout">
    Keluar
  </button>

</header>


<!-- LOGIN -->

<div id="loginBox" class="login">

  <h1>🔐 Login Admin</h1>

  <p>
    Masuk menggunakan akun Google admin SpeakOn.
  </p>

  <button id="google" class="google">
    🔵 Masuk dengan Google
  </button>

  <div id="error" class="error"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="dashboard" style="display:none">

  <h1>Dashboard SpeakOn</h1>

  <div class="info">

    👤 <b id="email"></b>

    <br>

    🛡️ <span id="role"></span>

  </div>


  <!-- STATISTIK -->

  <div class="stats">

    <div class="stat">

      <div class="stat-title">
        👤 Pengguna
      </div>

      <div id="statUsers" class="stat-number">
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        💬 Total Cerita
      </div>

      <div id="statStories" class="stat-number">
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        ✅ Sudah Dibalas
      </div>

      <div id="statReplied" class="stat-number">
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        ⏳ Belum Dibalas
      </div>

      <div id="statWaiting" class="stat-number">
        0
      </div>

    </div>

  </div>


  <!-- SUARA NOTIFIKASI -->

  <button id="sound" class="sound">
    🔔 Aktifkan Suara Notifikasi
  </button>


  <!-- CERITA -->

  <div id="messages">

    <div class="loading">
      Memuat cerita...
    </div>

  </div>

</div>


<script type="module">

import {auth,db} from "./firebase.js";

import {
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


// =====================================
// ADMIN YANG DIIZINKAN
// =====================================

const ADMIN_EMAILS={

  "ypiiw86@gmail.com":"Admin 1",

  "restuaxioo@gmail.com":"Admin 2",

  "dinolahh284@gmail.com":"Admin 3"

};


// =====================================
// ELEMENT
// =====================================

const loginBox=document.getElementById("loginBox");
const dashboard=document.getElementById("dashboard");
const google=document.getElementById("google");
const logout=document.getElementById("logout");
const error=document.getElementById("error");
const email=document.getElementById("email");
const role=document.getElementById("role");
const messages=document.getElementById("messages");
const sound=document.getElementById("sound");

const statUsers=document.getElementById("statUsers");
const statStories=document.getElementById("statStories");
const statReplied=document.getElementById("statReplied");
const statWaiting=document.getElementById("statWaiting");


// =====================================
// VARIABEL
// =====================================

let unsubscribe=null;
let currentAdmin="";
let firstLoad=true;

let audioContext=null;
let soundEnabled=false;


// =====================================
// SUARA NOTIFIKASI
// =====================================

sound.onclick=async()=>{

  try{

    const AudioContext=
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext){

      alert(
        "Browser tidak mendukung suara notifikasi."
      );

      return;

    }

    if(!audioContext){

      audioContext=new AudioContext();

    }

    if(audioContext.state==="suspended"){

      await audioContext.resume();

    }

    soundEnabled=true;

    sound.classList.add("active");

    sound.textContent=
      "🔔 Suara Notifikasi Aktif";

    playSound();

  }catch(err){

    console.error(err);

    alert(
      "Suara belum bisa diaktifkan. Coba tekan lagi."
    );

  }

};


function playSound(){

  if(!soundEnabled || !audioContext){
    return;
  }

  const osc=
    audioContext.createOscillator();

  const gain=
    audioContext.createGain();

  osc.connect(gain);

  gain.connect(
    audioContext.destination
  );

  osc.type="sine";

  osc.frequency.value=800;

  gain.gain.setValueAtTime(
    0.2,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.01,
    audioContext.currentTime+0.5
  );

  osc.start();

  osc.stop(
    audioContext.currentTime+0.5
  );

}


// =====================================
// LOGIN GOOGLE
// =====================================

google.onclick=async()=>{

  error.style.display="none";

  google.disabled=true;

  try{

    await signInWithPopup(
      auth,
      new GoogleAuthProvider()
    );

  }catch(err){

    console.error(err);

    error.textContent=
      "Login gagal. Coba lagi.";

    error.style.display="block";

  }

  google.disabled=false;

};


// =====================================
// CEK LOGIN
// =====================================

onAuthStateChanged(
  auth,
  user=>{

    if(!user){

      loginBox.style.display="block";

      dashboard.style.display="none";

      logout.style.display="none";

      if(unsubscribe){

        unsubscribe();

        unsubscribe=null;

      }

      return;

    }


    const mail=
      (user.email || "").toLowerCase();


    if(!ADMIN_EMAILS[mail]){

      alert(
        "Akun ini tidak terdaftar sebagai admin SpeakOn."
      );

      signOut(auth);

      return;

    }


    currentAdmin=
      ADMIN_EMAILS[mail];


    loginBox.style.display="none";

    dashboard.style.display="block";

    logout.style.display="block";


    email.textContent=
      user.email;

    role.textContent=
      currentAdmin;


    loadStories();

  }
);


// =====================================
// LOGOUT
// =====================================

logout.onclick=()=>{

  signOut(auth);

};


// =====================================
// LOAD CERITA
// =====================================

function loadStories(){

  if(unsubscribe){

    unsubscribe();

  }


  const q=query(

    collection(
      db,
      "stories"
    ),

    orderBy(
      "createdAt",
      "desc"
    )

  );


  firstLoad=true;


  unsubscribe=onSnapshot(

    q,

    snapshot=>{

      const users=
        new Set();

      let total=0;
      let replied=0;
      let waiting=0;


      // =====================================
      // STATISTIK
      // =====================================

      snapshot.forEach(
        story=>{

          const data=
            story.data();


          if(
            data.admin !== currentAdmin
          ){

            return;

          }


          total++;


          if(data.userId){

            users.add(
              data.userId
            );

          }


          if(
            data.reply &&
            String(data.reply).trim()!==""
          ){

            replied++;

          }else{

            waiting++;

          }

        }
      );


      statUsers.textContent=
        users.size;

      statStories.textContent=
        total;

      statReplied.textContent=
        replied;

      statWaiting.textContent=
        waiting;


      // =====================================
      // 🔔 CERITA BARU
      // =====================================

      if(!firstLoad){

        snapshot.docChanges().forEach(
          change=>{

            if(
              change.type==="added" &&
              change.doc.data().admin===currentAdmin
            ){

              playSound();

            }

          }
        );

      }


      firstLoad=false;


      // =====================================
      // FILTER CERITA
      // =====================================

      const adminStories=[];


      snapshot.forEach(
        story=>{

          const data=
            story.data();


          if(
            data.admin===currentAdmin
          ){

            adminStories.push({

              id:story.id,
              data:data

            });

          }

        }
      );


      if(adminStories.length===0){

        messages.innerHTML=
          `
          <div class="empty">
            📭 Belum ada cerita masuk.
          </div>
          `;

        return;

      }


      messages.innerHTML="";


      // =====================================
      // TAMPILKAN CERITA
      // =====================================

      adminStories.forEach(
        story=>{

          const data=
            story.data;

          const id=
            story.id;


          let date=
            "Waktu belum tersedia";


          if(data.createdAt){

            try{

              date=
                data.createdAt
                .toDate()
                .toLocaleString("id-ID");

            }catch(e){}

          }


          const card=
            document.createElement("div");

          card.className="message";


          card.innerHTML=`

            <div class="message-header">

              <span class="anonymous">
                👤 Pencerita Anonim
              </span>

              <span class="time">
                ${escapeHTML(date)}
              </span>

            </div>


            <div class="topic">

              ${escapeHTML(
                data.topic ||
                "Tanpa topik"
              )}

            </div>


            <div class="target">

              🎯 Ditujukan kepada:

              <b>

                ${escapeHTML(
                  data.admin ||
                  "Belum dipilih"
                )}

              </b>

            </div>


            <div class="text">

              ${escapeHTML(
                data.message || ""
              )}

            </div>


            ${
              data.reply

              ?

              `

              <div class="existing">

                <b>
                  💬 Balasan Admin:
                </b>

                <br><br>

                ${escapeHTML(
                  data.reply
                )}

              </div>

              `

              :

              `

              <div class="reply">

                <textarea
                  id="reply-${id}"
                  placeholder="Tulis balasan..."
                ></textarea>

                <button
                  class="send"
                  data-id="${id}"
                >
                  Kirim Balasan
                </button>

              </div>

              `

            }

          `;


          messages.appendChild(card);

        }
      );


      // =====================================
      // TOMBOL BALAS
      // =====================================

      document
      .querySelectorAll(".send")
      .forEach(
        btn=>{

          btn.onclick=()=>{
            sendReply(btn);
          };

        }
      );

    },

    err=>{

      console.error(err);

      messages.innerHTML=`

        <div
          class="error"
          style="display:block"
        >

          ❌ Gagal memuat cerita.

          <br><br>

          Periksa Firestore Rules.

        </div>

      `;

    }

  );

}


// =====================================
// KIRIM BALASAN
// =====================================

async function sendReply(button){

  const id=
    button.dataset.id;


  const textarea=
    document.getElementById(
      "reply-"+id
    );


  if(!textarea){
    return;
  }


  const reply=
    textarea.value.trim();


  if(!reply){

    alert(
      "Tulis balasan terlebih dahulu."
    );

    return;

  }


  button.disabled=true;

  button.textContent=
    "Mengirim...";


  try{

    await updateDoc(

      doc(
        db,
        "stories",
        id
      ),

      {
        reply:reply,
        status:"Sudah dijawab"
      }

    );


    alert(
      "Balasan berhasil dikirim."
    );

  }catch(err){

    console.error(err);

    alert(
      "Balasan gagal dikirim."
    );

    button.disabled=false;

    button.textContent=
      "Kirim Balasan";

  }

}


// =====================================
// AMANKAN HTML
// =====================================

function escapeHTML(text){

  const div=
    document.createElement("div");

  div.textContent=
    String(text);

  return div.innerHTML;

}

</script>

</body>
</html>
