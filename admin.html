<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeakOn - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 7px 0 0;
      opacity: 0.8;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.07);
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 13px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.6;
    }

    .google {
      background: #4285f4;
    }

    .logout {
      background: #dc2626;
    }

    .hidden {
      display: none;
    }

    .admin-info {
      background: #f3f4f6;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .story {
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .story p {
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
      background: #f3f4f6;
      font-size: 13px;
      font-weight: bold;
    }

    .waiting {
      background: #fff7ed;
      color: #9a3412;
    }

    .answered {
      background: #ecfdf5;
      color: #047857;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 15px;
      resize: vertical;
      margin-top: 10px;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
      padding: 14px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .success {
      background: #ecfdf5;
      color: #065f46;
      padding: 14px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  <h1>SPEAKON</h1>
  <p>Panel Admin</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <h2>🔐 Login Admin</h2>

    <p>
      Login menggunakan akun Google yang telah terdaftar sebagai admin.
    </p>

    <button id="loginButton" class="google">
      🔵 Login dengan Google
    </button>

    <div id="loginError"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card">

      <h2>👋 Dashboard Admin</h2>

      <div class="admin-info">
        <div>
          <strong>Admin:</strong>
          <span id="adminName"></span>
        </div>

        <div style="margin-top:8px;">
          <strong>Email:</strong>
          <span id="adminEmail"></span>
        </div>
      </div>

      <button id="logoutButton" class="logout">
        Keluar
      </button>

    </div>


    <div class="card">

      <h2>📨 Cerita Masuk</h2>

      <div id="stories">
        <div class="empty">
          Memuat cerita...
        </div>
      </div>

    </div>

  </div>

</div>


<script type="module">

  import { auth, db } from "./firebase.js";

  import {
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import {
    collection,
    query,
    orderBy,
    onSnapshot,
    doc,
    updateDoc
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  // ==========================================
  // DAFTAR 3 ADMIN
  // ==========================================

  const ADMIN_EMAILS = {

    "ypiiw86@gmail.com": "Admin 1",

    "restuaxioo@gmail.com": "Admin 2",

    "Dinolahh284@gmail.com": "Admin 3"

  };


  // ==========================================
  // ELEMENT
  // ==========================================

  const loginCard =
    document.getElementById("loginCard");

  const dashboard =
    document.getElementById("dashboard");

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const loginError =
    document.getElementById("loginError");

  const adminName =
    document.getElementById("adminName");

  const adminEmail =
    document.getElementById("adminEmail");

  const stories =
    document.getElementById("stories");


  // ==========================================
  // LOGIN GOOGLE
  // ==========================================

  loginButton.addEventListener(
    "click",
    async () => {

      loginError.innerHTML = "";

      loginButton.disabled = true;

      loginButton.textContent =
        "Membuka Google...";

      try {

        const provider =
          new GoogleAuthProvider();

        await signInWithPopup(
          auth,
          provider
        );

      } catch (error) {

        console.error(error);

        loginError.innerHTML =
          `<div class="error">
            Login gagal. Silakan coba lagi.
          </div>`;

      }

      loginButton.disabled = false;

      loginButton.textContent =
        "🔵 Login dengan Google";

    }
  );


  // ==========================================
  // CEK LOGIN
  // ==========================================

  onAuthStateChanged(
    auth,
    (user) => {

      if (!user) {

        loginCard.classList.remove(
          "hidden"
        );

        dashboard.classList.add(
          "hidden"
        );

        return;
      }


      const email =
        (user.email || "")
          .toLowerCase();


      // ======================================
      // CEK APAKAH EMAIL ADMIN
      // ======================================

      if (!ADMIN_EMAILS[email]) {

        signOut(auth);

        loginError.innerHTML =
          `<div class="error">
            ❌ Akun ini tidak terdaftar sebagai admin.
          </div>`;

        return;
      }


      // ======================================
      // TAMPILKAN DASHBOARD
      // ======================================

      loginCard.classList.add(
        "hidden"
      );

      dashboard.classList.remove(
        "hidden"
      );

      adminName.textContent =
        ADMIN_EMAILS[email];

      adminEmail.textContent =
        user.email;


      loadStories();

    }
  );


  // ==========================================
  // LOAD CERITA
  // ==========================================

  function loadStories() {

    const storiesQuery =
      query(
        collection(db, "stories"),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    onSnapshot(
      storiesQuery,

      (snapshot) => {

        stories.innerHTML = "";


        if (snapshot.empty) {

          stories.innerHTML =
            `<div class="empty">
              Belum ada cerita masuk.
            </div>`;

          return;
        }


        snapshot.forEach(
          (storyDoc) => {

            const story =
              storyDoc.data();

            const id =
              storyDoc.id;


            const storyElement =
              document.createElement("div");

            storyElement.className =
              "story";


            const statusClass =
              story.status === "Sudah dijawab"
                ? "answered"
                : "waiting";


            storyElement.innerHTML = `

              <div>

                <span class="badge">
                  ${escapeHTML(
                    story.admin || "Admin"
                  )}
                </span>

                <span class="badge ${statusClass}">
                  ${escapeHTML(
                    story.status || "Menunggu"
                  )}
                </span>

              </div>


              <p>
                <strong>Topik:</strong><br>
                ${escapeHTML(
                  story.topic || "-"
                )}
              </p>


              <p>
                <strong>Cerita:</strong><br>
                ${escapeHTML(
                  story.message || "-"
                )}
              </p>


              <p>
                <strong>Kode:</strong><br>
                ${escapeHTML(
                  story.storyCode || id
                )}
              </p>


              <label>
                <strong>Balasan Admin:</strong>
              </label>

              <textarea
                id="reply-${id}"
                placeholder="Tulis balasan untuk pencerita..."
              >${escapeHTML(
                story.reply || ""
              )}</textarea>


              <button
                data-id="${id}"
                class="reply-button"
              >
                💬 Simpan Balasan
              </button>

              <div id="result-${id}"></div>

            `;


            stories.appendChild(
              storyElement
            );

          }
        );


        // ====================================
        // TOMBOL BALAS
        // ====================================

        document
          .querySelectorAll(
            ".reply-button"
          )
          .forEach(
            (button) => {

              button.addEventListener(
                "click",
                () => {

                  saveReply(
                    button.dataset.id
                  );

                }
              );

            }
          );

      },

      (error) => {

        console.error(error);

        stories.innerHTML =
          `<div class="error">
            Gagal memuat cerita.
          </div>`;

      }
    );

  }


  // ==========================================
  // SIMPAN BALASAN
  // ==========================================

  async function saveReply(
    storyId
  ) {

    const textarea =
      document.getElementById(
        "reply-" + storyId
      );

    const result =
      document.getElementById(
        "result-" + storyId
      );


    const reply =
      textarea.value.trim();


    if (!reply) {

      result.innerHTML =
        `<div class="error">
          Balasan tidak boleh kosong.
        </div>`;

      return;
    }


    try {

      await updateDoc(
        doc(
          db,
          "stories",
          storyId
        ),
        {

          reply: reply,

          status: "Sudah dijawab",

          answeredAt:
            new Date()

        }
      );


      result.innerHTML =
        `<div class="success">
          ✅ Balasan berhasil disimpan.
        </div>`;


      setTimeout(
        () => {

          result.innerHTML = "";

        },
        2500
      );


    } catch (error) {

      console.error(error);

      result.innerHTML =
        `<div class="error">
          ❌ Balasan gagal disimpan.
        </div>`;

    }

  }


  // ==========================================
  // LOGOUT
  // ==========================================

  logoutButton.addEventListener(
    "click",
    async () => {

      await signOut(auth);

    }
  );


  // ==========================================
  // AMANKAN TEKS HTML
  // ==========================================

  function escapeHTML(
    text
  ) {

    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
